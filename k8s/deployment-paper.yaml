apiVersion: apps/v1
kind: Deployment
metadata:
  name: xau-paper-trader
  namespace: xau-trader
  labels:
    app: xau-paper-trader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xau-paper-trader
  template:
    metadata:
      labels:
        app: xau-paper-trader
    spec:
      containers:
      - name: paper
        image: xau-auto-trader:v2
        command: ["python", "scripts/run_paper_trading_continuous.py"]
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: secrets
          mountPath: /app/.env
          subPath: .env
        - name: data
          mountPath: /app/data
        - name: reports
          mountPath: /app/reports
      volumes:
      - name: config
        configMap:
          name: trader-config
      - name: secrets
        secret:
          secretName: trader-secrets
      - name: data
        persistentVolumeClaim:
          claimName: trader-data-pvc
      - name: reports
        persistentVolumeClaim:
          claimName: trader-reports-pvc
      restartPolicy: Always
