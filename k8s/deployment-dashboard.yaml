apiVersion: apps/v1
kind: Deployment
metadata:
  name: xau-dashboard
  namespace: xau-trader
  labels:
    app: xau-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xau-dashboard
  template:
    metadata:
      labels:
        app: xau-dashboard
    spec:
      containers:
      - name: dashboard
        image: xau-auto-trader:v2
        command: ["streamlit", "run", "src/dashboard/dashboard_v2.py", "--server.port=8501", "--server.address=0.0.0.0"]
        ports:
        - containerPort: 8501
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: secrets
          mountPath: /app/.env
          subPath: .env
        - name: data
          mountPath: /app/data
        - name: reports
          mountPath: /app/reports
      volumes:
      - name: config
        configMap:
          name: trader-config
      - name: secrets
        secret:
          secretName: trader-secrets
      - name: data
        persistentVolumeClaim:
          claimName: trader-data-pvc
      - name: reports
        persistentVolumeClaim:
          claimName: trader-reports-pvc
      restartPolicy: Always
