apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trader-data-pvc
  namespace: xau-trader
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trader-reports-pvc
  namespace: xau-trader
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
