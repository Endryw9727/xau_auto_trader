trading:
  symbol: "XAUUSD"
  live_mode: false
  base_timeframe: "15m"
  confirmation_timeframes:
    - "30m"
    - "1h"
    - "4h"

strategy:
  atr_multiplier_sl: 1.5
  atr_multiplier_tp: 3.0
  rsi_buy_max: 70.0
  rsi_sell_min: 30.0

risk:
  risk_per_trade: 0.005
  max_risk_per_trade: 0.01
  max_daily_loss: 0.02
  max_open_trades: 2
  max_consecutive_losses: 3
  min_risk_reward: 2.0
  value_per_point: 1.0

sessions:
  london:
    start: "08:00"
    end: "11:30"
  new_york:
    start: "14:30"
    end: "17:30"

filters:
  avoid_high_impact_news: true
  max_spread_points: 30
  use_adx_filter: true
  min_adx: 18

backtest:
  initial_balance: 1000
  commission_per_trade: 0.0
  slippage_points: 0.0
  warmup_candles: 220
