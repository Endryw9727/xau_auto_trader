trading:
  symbol: "XAUUSD"
  live_mode: false
  base_timeframe: "15m"
  confirmation_timeframes:
    - "30m"
    - "1h"
    - "4h"

strategy:
  atr_multiplier_sl: 1.5
  atr_multiplier_tp: 3.0
  rsi_buy_max: 70.0
  rsi_sell_min: 30.0

risk:
  risk_per_trade: 0.005
  max_risk_per_trade: 0.01
  max_daily_loss: 0.02
  max_open_trades: 2
  max_consecutive_losses: 3
  min_risk_reward: 2.0
  value_per_point: 1.0

sessions:
  enabled_sessions:
    - "Asia"
    - "New York"
    - "Off Session"
  london:
    start: "08:00"
    end: "11:30"
  new_york:
    start: "14:30"
    end: "17:30"

filters:
  avoid_high_impact_news: true
  max_spread_points: 30
  use_adx_filter: true
  min_adx: 18

# ===================== NEW: MACRO LAYER =====================
macro:
  enabled: true
  dxy_weight: 0.35
  us10y_weight: 0.25
  vix_weight: 0.20
  spx_weight: 0.20
  correlation_window: 50
  dxy_symbol: "DX-Y.NYB"
  us10y_symbol: "^TNX"
  vix_symbol: "^VIX"
  spx_symbol: "^GSPC"
  min_correlation_confidence: 0.65
  block_trade_against_macro: true
  macro_score_threshold: 0.30

# ===================== NEW: NEWS LAYER =====================
news:
  enabled: true
  block_before_minutes: 30
  block_after_minutes: 15
  block_high_impact_only: true
  max_events_per_day: 5

# ===================== NEW: AI REASONING =====================
ai_reasoning:
  enabled: true
  weights:
    technical: 0.40
    macro: 0.30
    news: 0.15
    session: 0.10
    risk: 0.05
  min_confidence_for_trade: 0.55
  generate_explanations: true
  generate_warnings: true

# ===================== NEW: SMART MONEY =====================
smart_money:
  enabled: true
  fvg_lookback: 50
  ob_lookback: 50
  liquidity_lookback: 50
  min_fvg_size_points: 2.0

backtest:
  initial_balance: 1000
  commission_per_trade: 0.0
  slippage_points: 0.0
  warmup_candles: 220
  rolling_window_candles: 500
